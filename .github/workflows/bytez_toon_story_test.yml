name: Bytez Toon Story Test

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Bytez text-to-video model'
        required: false
        default: 'Wan-AI/Wan2.1-T2V-1.3B'
      category:
        description: 'Story category (reserved for future variants)'
        required: false
        default: 'toon-story'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Generate isolated Bytez toon story
        env:
          BYTEZ_API_KEY: ${{ secrets.BYTEZ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BYTEZ_VIDEO_MODEL: ${{ inputs.model }}
        run: python src/bytez_toon_story_test.py

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: bytez-toon-story-test
          path: |
            bytez_toon_story_test.mp4
            bytez_toon_story_metadata.json
          if-no-files-found: error
          retention-days: 7
