name: Toon Kids - Wan I2V Episode V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wan-episode-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_KERNEL: ${{ secrets.KAGGLE_USERNAME }}/toon-kids-wan-episode-v2-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Kaggle credentials
        shell: bash
        run: |
          test -n "$KAGGLE_USERNAME" || { echo "❌ Missing KAGGLE_USERNAME"; exit 1; }
          test -n "$KAGGLE_KEY" || { echo "❌ Missing KAGGLE_KEY"; exit 1; }
          echo "✅ Kaggle credentials found"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Prepare Kaggle kernel
        shell: bash
        run: |
          rm -rf kaggle_kernel
          mkdir -p kaggle_kernel/src
          cp tools/kaggle_wan_i2v_v2.py kaggle_kernel/generate_episode.py
          cp src/toon_kids_story.py kaggle_kernel/src/toon_kids_story.py
          cp story_history.json kaggle_kernel/story_history.json
          cat > kaggle_kernel/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_KERNEL}",
            "title": "Toon Kids Wan I2V V2 ${GITHUB_RUN_ID}",
            "code_file": "generate_episode.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": "false",
            "enable_gpu": "true",
            "enable_internet": "true",
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF
          echo "Prepared V2 kernel:"; find kaggle_kernel -maxdepth 2 -type f -print

      - name: Push and run on Kaggle T4
        run: kaggle kernels push -p kaggle_kernel

      - name: Wait for V2 final MP4
        shell: bash
        run: |
          rm -rf kaggle_output
          mkdir -p kaggle_output
          for i in $(seq 1 140); do
            echo "--- Kaggle poll $i/140 ---"
            rm -rf kaggle_output/*
            if kaggle kernels output "$KAGGLE_KERNEL" -p kaggle_output --force 2>&1; then
              find kaggle_output -maxdepth 2 -type f -printf '%p %s bytes\n' || true
              if find kaggle_output -type f -name 'toon_kids_wan_i2v_v2.mp4' | grep -q .; then
                echo "✅ V2 episode returned"
                exit 0
              fi
            fi
            sleep 60
          done
          echo "❌ Kaggle did not return the V2 episode within the GitHub wait window"
          exit 1

      - name: Verify V2 video properties
        shell: bash
        run: |
          VIDEO=$(find kaggle_output -type f -name 'toon_kids_wan_i2v_v2.mp4' | head -n 1)
          test -n "$VIDEO" || { echo "❌ V2 MP4 missing"; exit 1; }
          cp "$VIDEO" toon_kids_wan_i2v_v2.mp4
          ffprobe -v error -show_entries stream=width,height,duration -of default=noprint_wrappers=1 toon_kids_wan_i2v_v2.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 toon_kids_wan_i2v_v2.mp4)" = "480"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 toon_kids_wan_i2v_v2.mp4)" = "832"
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 toon_kids_wan_i2v_v2.mp4)
          python - <<PY
          d=float("$DURATION")
          assert d >= 18, f"Episode is too short: {d:.2f}s"
          assert d <= 30, f"Episode is unexpectedly long: {d:.2f}s"
          print(f"✅ Episode duration {d:.2f}s")
          PY
          ls -lh toon_kids_wan_i2v_v2.mp4

      - name: Upload V2 episode artifact
        uses: actions/upload-artifact@v4
        with:
          name: toon-kids-wan-i2v-v2
          path: toon_kids_wan_i2v_v2.mp4
          if-no-files-found: error
          retention-days: 7
