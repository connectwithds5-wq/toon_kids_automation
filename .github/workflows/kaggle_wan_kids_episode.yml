name: Toon Kids - Wan I2V Episode Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wan-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_KERNEL: ${{ secrets.KAGGLE_USERNAME }}/toon-kids-wan-episode-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Kaggle credentials
        shell: bash
        run: |
          test -n "$KAGGLE_USERNAME" || { echo "❌ Missing KAGGLE_USERNAME"; exit 1; }
          test -n "$KAGGLE_KEY" || { echo "❌ Missing KAGGLE_KEY"; exit 1; }
          echo "✅ Kaggle credentials found"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Prepare Kaggle kernel
        shell: bash
        run: |
          rm -rf kaggle_kernel
          mkdir -p kaggle_kernel/src
          cp tools/kaggle_wan_i2v_production.py kaggle_kernel/generate_episode.py
          cp src/toon_kids_story.py kaggle_kernel/src/toon_kids_story.py
          cp story_history.json kaggle_kernel/story_history.json
          cat > kaggle_kernel/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_KERNEL}",
            "title": "Toon Kids Wan I2V Episode ${GITHUB_RUN_ID}",
            "code_file": "generate_episode.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": "false",
            "enable_gpu": "true",
            "enable_internet": "true",
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF
          echo "Prepared:"; find kaggle_kernel -maxdepth 2 -type f -print

      - name: Push and run on Kaggle T4
        run: kaggle kernels push -p kaggle_kernel

      - name: Wait for final MP4
        shell: bash
        run: |
          rm -rf kaggle_output
          mkdir -p kaggle_output
          for i in $(seq 1 100); do
            echo "--- Kaggle poll $i/100 ---"
            rm -rf kaggle_output/*
            if kaggle kernels output "$KAGGLE_KERNEL" -p kaggle_output --force 2>&1; then
              find kaggle_output -maxdepth 2 -type f -printf '%p %s bytes\n' || true
              if find kaggle_output -type f -name 'toon_kids_wan_i2v_episode.mp4' | grep -q .; then
                echo "✅ Final episode returned"
                exit 0
              fi
            fi
            sleep 60
          done
          echo "❌ Kaggle did not return the final episode within 100 minutes"
          exit 1

      - name: Verify video properties
        shell: bash
        run: |
          VIDEO=$(find kaggle_output -type f -name 'toon_kids_wan_i2v_episode.mp4' | head -n 1)
          test -n "$VIDEO" || { echo "❌ Final MP4 missing"; exit 1; }
          cp "$VIDEO" toon_kids_wan_i2v_episode.mp4
          ffprobe -v error -show_entries stream=width,height,duration -of default=noprint_wrappers=1 toon_kids_wan_i2v_episode.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 toon_kids_wan_i2v_episode.mp4)" = "480"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 toon_kids_wan_i2v_episode.mp4)" = "832"
          ls -lh toon_kids_wan_i2v_episode.mp4

      - name: Upload episode artifact
        uses: actions/upload-artifact@v4
        with:
          name: toon-kids-wan-i2v-episode
          path: toon_kids_wan_i2v_episode.mp4
          retention-days: 7
