name: Toon Story - Wan 2.2 Cinematic + 4K Master

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toon-wan-4k:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Gemini 3.1 Flash Image has no Free Tier quota for image generation.
      # Keep it disabled; the free HF ZeroGPU Z-Image-Turbo renderer is used first.
      GEMINI_IMAGE_ENABLED: "false"
      GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
      ZIMAGE_ENABLED: "true"
      ZIMAGE_SPACE: mrfakename/Z-Image-Turbo
      ZIMAGE_WIDTH: "864"
      ZIMAGE_HEIGHT: "1536"
      ZIMAGE_STEPS: "9"
      # This workflow is for original nursery rhymes, not prose stories.
      CONTENT_MODE: nursery_rhyme
      CINEMATIC_ONLY: "true"
      HF_WAN_SPACE: zerogpu-aoti/wan2-2-fp8da-aoti-faster
      HF_WAN_OUTPUT: toon_wan_10sec_story.mp4
      INPUT_VIDEO: toon_wan_10sec_story.mp4
      OUTPUT_VIDEO: toon_wan_10sec_story_4k.mp4
      X264_PRESET: medium
      X264_CRF: 16
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pillow gradio_client google-genai==2.23.0 google-api-python-client google-auth google-auth-oauthlib
          python -c "import google.genai; print('google-genai:', google.genai.__version__)"

      - name: Validate pipeline
        run: |
          python -m py_compile src/hf_wan_10sec_story.py src/nursery_rhyme.py src/toon_kids_story.py src/upscale_vertical_4k.py

      - name: Generate cinematic nursery rhyme with Wan 2.2
        run: python src/hf_wan_10sec_story.py

      - name: Verify Wan cinematic nursery-rhyme master
        run: |
          test -s toon_wan_10sec_story.mp4
          ffprobe -v error -show_entries format=duration,size -show_streams -of default=noprint_wrappers=1 toon_wan_10sec_story.mp4

      - name: Create 4K vertical master
        run: python src/upscale_vertical_4k.py

      - name: Verify 4K output
        run: |
          test -s toon_wan_10sec_story_4k.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 toon_wan_10sec_story_4k.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 toon_wan_10sec_story_4k.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=noprint_wrappers=1 toon_wan_10sec_story_4k.mp4

      - name: Upload 4K cinematic nursery rhyme
        uses: actions/upload-artifact@v4
        with:
          name: toon-wan-10sec-nursery-rhyme-4k
          path: toon_wan_10sec_story_4k.mp4
          retention-days: 3
