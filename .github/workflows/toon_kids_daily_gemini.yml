name: Toon Kids AI Stories

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"   # 1:00 PM IST
    - cron: "0 15 * * *"   # 8:30 PM IST

permissions:
  contents: write

concurrency:
  group: toon-kids-ai-story
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      GEMINI_IMAGE_MODEL: gemini-2.5-flash-image
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TTS_RATE: "+5%"
      UPLOAD_YOUTUBE: "true"
      RUN_SLOT: ${{ github.event.schedule == '30 7 * * *' && '0' || '1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth google-auth-oauthlib edge-tts pillow

      - name: Validate secrets
        run: |
          test -n "$GEMINI_API_KEY" || (echo "Missing GEMINI_API_KEY" && exit 1)
          test -n "$YOUTUBE_CLIENT_ID" || (echo "Missing YOUTUBE_CLIENT_ID" && exit 1)
          test -n "$YOUTUBE_CLIENT_SECRET" || (echo "Missing YOUTUBE_CLIENT_SECRET" && exit 1)
          test -n "$YOUTUBE_REFRESH_TOKEN" || (echo "Missing YOUTUBE_REFRESH_TOKEN" && exit 1)

      - name: Generate Toon Kids Short
        run: python src/toon_kids_story.py

      - name: Verify video
        run: |
          test -s toon_kids_short.mp4
          test -s story_metadata.json

      - name: Commit story history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add story_history.json
          git diff --cached --quiet || git commit -m "Update Toon Kids story history"
          git push

      - name: Cleanup
        if: always()
        run: |
          rm -rf work
          rm -f final.mp4
