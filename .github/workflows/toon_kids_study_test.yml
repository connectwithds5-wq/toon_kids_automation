name: Toon Kids - Kids Study Story Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kids-study-story:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TTS_RATE: "+0%"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pillow

      - name: Prepare dynamic renderer
        run: |
          # Fix the single generated-line typo defensively before compilation.
          sed -i 's/width=max(1,int(3\*s)););/width=max(1,int(3*s)));/' src/toon_kids_study_dynamic.py
          # Avoid unsupported emoji glyphs in the raster renderer.
          sed -i 's/रॉकेट तैयार है/रॉकेट तैयार है/g; s/हमने कर ली! 🎉/हमने कर ली!/g' src/toon_kids_study_dynamic.py
          python -m py_compile src/toon_kids_study_dynamic.py
          echo "✅ Dynamic renderer syntax OK."

      - name: Generate Kids Study Short V3
        run: python src/toon_kids_study_dynamic.py

      - name: Verify output
        run: |
          test -s toon_kids_study_short.mp4 || { echo "❌ Study video missing"; exit 1; }
          test -s study_story_metadata.json || { echo "❌ Study metadata missing"; exit 1; }
          echo "✅ Dynamic Kids Study V3 generated."
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 toon_kids_study_short.mp4
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 toon_kids_study_short.mp4
          cat study_story_metadata.json

      - name: Commit study story history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add study_story_history.json
          if git diff --cached --quiet; then
            echo "No study story history changes."
          else
            git commit -m "Update Kids Study story history"
            git push
          fi

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: toon-kids-study-short-v3
          path: |
            toon_kids_study_short.mp4
            study_story_metadata.json
          retention-days: 3

      - name: Cleanup
        if: always()
        run: rm -rf work_dynamic
