name: Toon Story - Wan 2.2 10s AV V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wan-story-av-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_WAN_SPACE: zerogpu-aoti/wan2-2-fp8da-aoti-faster
      HF_WAN_OUTPUT: toon_wan_10sec_story_av_v2.mp4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pillow gradio_client google-genai google-api-python-client google-auth google-auth-oauthlib
      - name: Check Hugging Face token
        run: |
          if [ -n "$HF_TOKEN" ]; then echo "HF_TOKEN present"; else echo "HF_TOKEN not set — anonymous quota"; fi
      - name: Validate V2 script
        run: python -m py_compile src/hf_wan_10sec_story_av_v2.py src/toon_kids_story.py
      - name: Generate improved 10s story
        run: python src/hf_wan_10sec_story_av_v2.py
      - name: Verify final media
        run: |
          test -s toon_wan_10sec_story_av_v2.mp4
          ffprobe -v error -show_entries format=duration,size -show_streams -of default=noprint_wrappers=1 toon_wan_10sec_story_av_v2.mp4
      - name: Upload improved video artifact
        uses: actions/upload-artifact@v4
        with:
          name: toon-wan-10sec-av-v2
          path: toon_wan_10sec_story_av_v2.mp4
          retention-days: 3
