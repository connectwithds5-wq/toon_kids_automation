name: Toon Kids - Free Kaggle GPU Video Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kaggle-gpu-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_KERNEL: ${{ secrets.KAGGLE_USERNAME }}/toon-kids-gpu-test-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Kaggle credentials
        shell: bash
        run: |
          test -n "$KAGGLE_USERNAME" || { echo "❌ Add GitHub secret KAGGLE_USERNAME first."; exit 1; }
          test -n "$KAGGLE_KEY" || { echo "❌ Add GitHub secret KAGGLE_KEY first."; exit 1; }
          echo "✅ Kaggle credentials found."

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Prepare Kaggle kernel
        shell: bash
        run: |
          mkdir -p kaggle_kernel
          cp tools/kaggle_gpu_video_test.py kaggle_kernel/generate_test.py
          cat > kaggle_kernel/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_KERNEL}",
            "title": "Toon Kids GPU Test ${GITHUB_RUN_ID}",
            "code_file": "generate_test.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": "false",
            "enable_gpu": "true",
            "enable_internet": "true",
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF
          cat kaggle_kernel/kernel-metadata.json

      - name: Push and run on Kaggle GPU
        run: kaggle kernels push -p kaggle_kernel

      - name: Wait for Kaggle output
        shell: bash
        run: |
          rm -rf kaggle_output
          mkdir -p kaggle_output

          for i in $(seq 1 40); do
            echo "--- Output poll $i/40 ---"
            rm -rf kaggle_output/*

            if kaggle kernels output "$KAGGLE_KERNEL" -p kaggle_output --force 2>&1; then
              find kaggle_output -maxdepth 2 -type f -print
              if find kaggle_output -type f -name '*.mp4' | grep -q .; then
                echo "✅ Kaggle output contains MP4; kernel run is complete."
                exit 0
              fi
            else
              echo "Kaggle output is not ready yet."
            fi

            sleep 45
          done

          echo "❌ Kaggle did not return an MP4 within the GitHub wait window."
          exit 1

      - name: Verify generated MP4
        shell: bash
        run: |
          VIDEO=$(find kaggle_output -type f -name '*.mp4' | head -n 1)
          test -n "$VIDEO" || { echo "❌ No MP4 returned by Kaggle."; exit 1; }
          cp "$VIDEO" toon_kids_kaggle_gpu_test.mp4
          ls -lh toon_kids_kaggle_gpu_test.mp4

      - name: Upload test video artifact
        uses: actions/upload-artifact@v4
        with:
          name: toon-kids-kaggle-gpu-test
          path: toon_kids_kaggle_gpu_test.mp4
          retention-days: 3
