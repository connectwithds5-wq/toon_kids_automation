name: Toon Story - HF Wan 2.2 10s Full Story Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wan-10sec-story:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_WAN_SPACE: zerogpu-aoti/wan2-2-fp8da-aoti-faster
      HF_WAN_OUTPUT: toon_wan_10sec_story.mp4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth google-auth-oauthlib edge-tts pillow gradio_client

      - name: Check Hugging Face token
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "HF_TOKEN present — authenticated ZeroGPU quota will be used."
          else
            echo "HF_TOKEN not set — using anonymous quota."
          fi

      - name: Validate scripts
        run: python -m py_compile src/hf_wan_10sec_story.py src/hf_wan_test.py src/toon_kids_story.py

      - name: Generate full 10-second story
        run: python src/hf_wan_10sec_story.py

      - name: Verify 10-second output
        run: |
          test -s toon_wan_10sec_story.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 toon_wan_10sec_story.mp4

      - name: Upload 10-second story artifact
        uses: actions/upload-artifact@v4
        with:
          name: toon-wan-10sec-full-story
          path: toon_wan_10sec_story.mp4
          retention-days: 3
