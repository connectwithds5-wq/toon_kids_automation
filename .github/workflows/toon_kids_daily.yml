name: Toon Kids AI Stories

on:
  workflow_dispatch:

  schedule:
    - cron: "30 7 * * *"   # 1:00 PM IST
    - cron: "0 15 * * *"   # 8:30 PM IST


permissions:
  contents: write


concurrency:
  group: toon-kids-ai-story
  cancel-in-progress: false


jobs:

  make-short:

    runs-on: ubuntu-latest


    env:

      # =====================================================
      # GEMINI - STORY ONLY
      # =====================================================

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      GEMINI_TEXT_MODEL: gemini-3.6-flash


      # =====================================================
      # CLOUDFLARE - IMAGE GENERATION
      # =====================================================

      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


      # =====================================================
      # YOUTUBE
      # =====================================================

      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}

      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}


      # =====================================================
      # OTHER SETTINGS
      # =====================================================

      TTS_RATE: "+5%"

      UPLOAD_YOUTUBE: "true"

      RUN_SLOT: ${{ github.event.schedule == '30 7 * * *' && '0' || '1' }}


    steps:


      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout

        uses: actions/checkout@v4


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # =====================================================
      # FFMPEG
      # =====================================================

      - name: Install FFmpeg

        run: |

          sudo apt-get update

          sudo apt-get install -y ffmpeg


      # =====================================================
      # PYTHON PACKAGES
      # =====================================================

      - name: Install packages

        run: |

          python -m pip install --upgrade pip

          pip install \
            google-genai \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            edge-tts \
            pillow \
            requests


      # =====================================================
      # VALIDATE SECRETS
      # =====================================================

      - name: Validate secrets

        run: |

          test -n "$GEMINI_API_KEY" || (
            echo "Missing GEMINI_API_KEY"
            exit 1
          )

          test -n "$CLOUDFLARE_API_TOKEN" || (
            echo "Missing CLOUDFLARE_API_TOKEN"
            exit 1
          )

          test -n "$CLOUDFLARE_ACCOUNT_ID" || (
            echo "Missing CLOUDFLARE_ACCOUNT_ID"
            exit 1
          )

          test -n "$YOUTUBE_CLIENT_ID" || (
            echo "Missing YOUTUBE_CLIENT_ID"
            exit 1
          )

          test -n "$YOUTUBE_CLIENT_SECRET" || (
            echo "Missing YOUTUBE_CLIENT_SECRET"
            exit 1
          )

          test -n "$YOUTUBE_REFRESH_TOKEN" || (
            echo "Missing YOUTUBE_REFRESH_TOKEN"
            exit 1
          )

          echo "All required secrets are present."


      # =====================================================
      # GENERATE VIDEO
      # =====================================================

      - name: Generate Toon Kids Short

        run: |

          python src/toon_kids_story.py


      # =====================================================
      # VERIFY VIDEO
      # =====================================================

      - name: Verify video

        run: |

          test -s toon_kids_short.mp4

          test -s story_metadata.json

          echo "Video verification successful."

          ls -lh toon_kids_short.mp4


      # =====================================================
      # COMMIT STORY HISTORY
      # =====================================================

      - name: Commit story history

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add story_history.json

          git diff --cached --quiet || \
            git commit -m "Update Toon Kids story history"

          git push


      # =====================================================
      # CLEANUP
      # =====================================================

      - name: Cleanup

        if: always()

        run: |

          rm -rf work

          rm -f final.mp4
