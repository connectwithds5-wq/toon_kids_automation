name: Toon Kids AI Stories

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"   # 1:00 PM IST
    - cron: "0 15 * * *"   # 8:30 PM IST

permissions:
  contents: write

concurrency:
  group: toon-kids-ai-story
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
      VEO_MODEL: veo-3.1-fast-generate-preview

      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

      TTS_RATE: "+8%"
      UPLOAD_YOUTUBE: "true"
      RUN_SLOT: ${{ github.event.schedule == '30 7 * * *' && '0' || github.event.schedule == '0 15 * * *' && '1' || 'manual' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth google-auth-oauthlib edge-tts

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$GEMINI_API_KEY" || { echo "❌ Missing GEMINI_API_KEY"; exit 1; }
          test -n "$YOUTUBE_CLIENT_ID" || { echo "❌ Missing YOUTUBE_CLIENT_ID"; exit 1; }
          test -n "$YOUTUBE_CLIENT_SECRET" || { echo "❌ Missing YOUTUBE_CLIENT_SECRET"; exit 1; }
          test -n "$YOUTUBE_REFRESH_TOKEN" || { echo "❌ Missing YOUTUBE_REFRESH_TOKEN"; exit 1; }
          echo "✅ Required secrets are present."

      - name: Validate Python
        run: |
          python -m py_compile src/toon_kids_story.py
          echo "✅ Python syntax OK."

      - name: Show configuration
        run: |
          echo "=========================================="
          echo "TOON KIDS — VEO 3.1"
          echo "=========================================="
          python --version
          ffmpeg -version | head -n 1
          echo "Gemini: $GEMINI_TEXT_MODEL"
          echo "Veo: $VEO_MODEL"
          echo "Run slot: $RUN_SLOT"
          echo "YouTube upload: $UPLOAD_YOUTUBE"
          echo "=========================================="

      - name: Generate Toon Kids Short
        run: python src/toon_kids_story.py

      - name: Verify video
        run: |
          test -s toon_kids_short.mp4 || { echo "❌ Video missing"; exit 1; }
          test -s story_metadata.json || { echo "❌ Metadata missing"; exit 1; }
          echo "✅ Video generated successfully."
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 toon_kids_short.mp4
          cat story_metadata.json

      - name: Commit story history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add story_history.json
          if git diff --cached --quiet; then
            echo "No story history changes."
          else
            git commit -m "Update Toon Kids story history"
            git push
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -rf work
          echo "Cleanup completed."
