name: Toon Kids AI Stories

on:
  workflow_dispatch:

  schedule:
    - cron: "30 7 * * *"   # 1:00 PM IST
    - cron: "0 15 * * *"   # 8:30 PM IST

permissions:
  contents: write

concurrency:
  group: toon-kids-ai-story
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.6-flash
      GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite

      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

      TTS_RATE: "+20%"
      TTS_PITCH: "+5Hz"
      UPLOAD_YOUTUBE: "true"

      RUN_SLOT: ${{ github.event.schedule == '30 7 * * *' && '0' || github.event.schedule == '0 15 * * *' && '1' || 'manual' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            google-genai \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            edge-tts \
            pillow \
            requests

      - name: Validate secrets
        shell: bash
        run: |
          echo "Checking required secrets..."
          test -n "$GEMINI_API_KEY" || { echo "❌ Missing GEMINI_API_KEY"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "❌ Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "❌ Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$YOUTUBE_CLIENT_ID" || { echo "❌ Missing YOUTUBE_CLIENT_ID"; exit 1; }
          test -n "$YOUTUBE_CLIENT_SECRET" || { echo "❌ Missing YOUTUBE_CLIENT_SECRET"; exit 1; }
          test -n "$YOUTUBE_REFRESH_TOKEN" || { echo "❌ Missing YOUTUBE_REFRESH_TOKEN"; exit 1; }
          echo "✅ All required secrets are present."

      - name: Show V4 configuration
        run: |
          echo "=========================================="
          echo "TOON KIDS V4 CONFIGURATION"
          echo "=========================================="
          echo "Python:"
          python --version
          echo "FFmpeg:"
          ffmpeg -version | head -n 1
          echo "Gemini primary: $GEMINI_TEXT_MODEL"
          echo "Gemini fallback: $GEMINI_FALLBACK_MODEL"
          echo "Cloudflare image model: @cf/black-forest-labs/flux-1-schnell"
          echo "TTS rate: $TTS_RATE"
          echo "TTS pitch: $TTS_PITCH"
          echo "Run slot: $RUN_SLOT"
          echo "Upload to YouTube: $UPLOAD_YOUTUBE"
          echo "=========================================="

      - name: Generate Toon Kids V4 Short
        run: |
          echo "Starting Toon Kids V4 generation..."
          python src/toon_kids_story.py

      - name: Verify video
        run: |
          echo "Checking generated files..."
          test -s toon_kids_short.mp4 || { echo "❌ toon_kids_short.mp4 not found"; exit 1; }
          test -s story_metadata.json || { echo "❌ story_metadata.json not found"; exit 1; }
          echo "✅ Video verification successful."
          ls -lh toon_kids_short.mp4
          echo "Metadata:"
          cat story_metadata.json

      - name: Commit story history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add story_history.json
          if git diff --cached --quiet; then
            echo "No story history changes."
          else
            git commit -m "Update Toon Kids story history"
            git push
          fi

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning temporary files..."
          rm -rf work
          rm -f final.mp4
          echo "Cleanup completed."
          
