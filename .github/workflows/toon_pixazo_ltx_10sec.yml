name: Toon Story - Gemini + Pixazo LTX Cinematic Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixazo-story:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.5-flash-lite
      GEMINI_FALLBACK_MODEL: gemini-3.6-flash
      PIXAZO_OUTPUT: toon_pixazo_ltx_10sec_story_av.mp4
      PIXAZO_METADATA: pixazo_story_metadata.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests edge-tts pillow gradio_client google-genai google-api-python-client google-auth google-auth-oauthlib

      - name: Check AI keys
        run: |
          if [ -z "$PIXAZO_API_KEY" ]; then
            echo "❌ PIXAZO_API_KEY secret is missing"
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ GEMINI_API_KEY secret is missing"
            exit 1
          fi
          echo "✅ PIXAZO_API_KEY present"
          echo "✅ GEMINI_API_KEY present"

      - name: Validate cinematic pipeline
        run: |
          python -m py_compile src/pixazo_ltx_10sec_story_av.py src/hf_wan_10sec_story_av_v2.py src/toon_kids_story.py
          echo "✅ Python syntax OK"

      - name: Generate Gemini story + cinematic Pixazo video
        run: python src/pixazo_ltx_10sec_story_av.py

      - name: Verify final media and story metadata
        run: |
          test -s toon_pixazo_ltx_10sec_story_av.mp4
          test -s pixazo_story_metadata.json
          ffprobe -v error -show_entries format=duration,size -show_streams -of default=noprint_wrappers=1 toon_pixazo_ltx_10sec_story_av.mp4
          echo "----- GEMINI STORY -----"
          cat pixazo_story_metadata.json

      - name: Upload video + story metadata
        uses: actions/upload-artifact@v4
        with:
          name: toon-gemini-pixazo-cinematic-test
          path: |
            toon_pixazo_ltx_10sec_story_av.mp4
            pixazo_story_metadata.json
          retention-days: 3
