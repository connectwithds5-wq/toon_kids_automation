name: Toon Kids - Gemini + Pixazo LTX Hindi Nursery Rhyme

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Learning category for the rhyme"
        required: true
        default: "numbers"
        type: choice
        options:
          - numbers
          - fruits
          - vegetables
          - colors
          - animals

permissions:
  contents: read

jobs:
  pixazo-rhyme:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.5-flash-lite
      GEMINI_FALLBACK_MODEL: gemini-3.6-flash
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      CONTENT_CATEGORY: ${{ inputs.category }}
      PIXAZO_OUTPUT: toon_pixazo_ltx_20sec_rhyme.mp4
      PIXAZO_METADATA: pixazo_rhyme_metadata.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow google-genai google-api-python-client google-auth google-auth-oauthlib edge-tts gradio-client

      - name: Check AI keys and selected category
        run: |
          test -n "$PIXAZO_API_KEY" || (echo "❌ PIXAZO_API_KEY missing" && exit 1)
          test -n "$GEMINI_API_KEY" || (echo "❌ GEMINI_API_KEY missing" && exit 1)
          echo "✅ PIXAZO_API_KEY present"
          echo "✅ GEMINI_API_KEY present"
          echo "🎵 Rhyme category: $CONTENT_CATEGORY"
          echo "🧠 Gemini text: $GEMINI_TEXT_MODEL"
          echo "🎤 Gemini TTS: $GEMINI_TTS_MODEL"
          echo "🥁 Rhythm: 124 BPM / 4-4"

      - name: Validate Rhyme Engine V2
        run: |
          python -m py_compile src/pixazo_rhyme_engine_v2.py src/hf_wan_10sec_story_av_v2.py src/toon_kids_story.py
          python -c "import edge_tts, gradio_client; print('✅ Runtime video dependencies import OK')"
          echo "✅ Rhyme Engine V2 syntax OK"

      - name: Generate original Hindi nursery rhyme V2
        run: python src/pixazo_rhyme_engine_v2.py

      - name: Verify final rhyme media
        run: |
          test -s toon_pixazo_ltx_20sec_rhyme.mp4
          test -s pixazo_rhyme_metadata.json
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nk=1 toon_pixazo_ltx_20sec_rhyme.mp4)
          echo "🎬 FINAL DURATION: ${DURATION}s"
          python - "$DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert d >= 19.95, f"Final video too short: {d:.3f}s"
          assert d <= 20.10, f"Final video too long: {d:.3f}s"
          print("✅ Exact 20-second duration gate passed")
          PY
          ffprobe -v error -show_entries format=duration,size -show_streams -of default=noprint_wrappers=1 toon_pixazo_ltx_20sec_rhyme.mp4
          echo "----- GEMINI RHYTHME PLAN V2 -----"
          cat pixazo_rhyme_metadata.json

      - name: Upload rhyme video + metadata
        uses: actions/upload-artifact@v4
        with:
          name: toon-kids-${{ inputs.category }}-rhyme-v2-test
          path: |
            toon_pixazo_ltx_20sec_rhyme.mp4
            pixazo_rhyme_metadata.json
          retention-days: 3
