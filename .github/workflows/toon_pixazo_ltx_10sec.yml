name: Toon Kids - Gemini + Pixazo LTX Hindi Nursery Rhyme

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixazo-rhyme:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-3.5-flash-lite
      GEMINI_FALLBACK_MODEL: gemini-3.6-flash
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      CONTENT_CATEGORY: numbers
      PIXAZO_OUTPUT: toon_pixazo_ltx_20sec_rhyme.mp4
      PIXAZO_METADATA: pixazo_rhyme_metadata.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests edge-tts pillow gradio_client google-genai google-api-python-client google-auth google-auth-oauthlib

      - name: Check AI keys
        run: |
          if [ -z "$PIXAZO_API_KEY" ]; then
            echo "❌ PIXAZO_API_KEY secret is missing"
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ GEMINI_API_KEY secret is missing"
            exit 1
          fi
          echo "✅ PIXAZO_API_KEY present"
          echo "✅ GEMINI_API_KEY present"
          echo "🎵 Format: original Hindi nursery rhyme"
          echo "🧠 Gemini text: $GEMINI_TEXT_MODEL"
          echo "🎤 Gemini TTS: $GEMINI_TTS_MODEL"

      - name: Validate rhyme pipeline
        run: |
          python -m py_compile src/pixazo_ltx_10sec_story_av.py src/hf_wan_10sec_story_av_v2.py src/toon_kids_story.py
          echo "✅ Python syntax OK"

      - name: Generate Hindi counting rhyme with Gemini + Pixazo
        run: python src/pixazo_ltx_10sec_story_av.py

      - name: Verify final rhyme media
        run: |
          test -s toon_pixazo_ltx_20sec_rhyme.mp4
          test -s pixazo_rhyme_metadata.json
          ffprobe -v error -show_entries format=duration,size -show_streams -of default=noprint_wrappers=1 toon_pixazo_ltx_20sec_rhyme.mp4
          echo "----- GEMINI RHYME PLAN -----"
          cat pixazo_rhyme_metadata.json

      - name: Upload rhyme video + metadata
        uses: actions/upload-artifact@v4
        with:
          name: toon-kids-hindi-counting-rhyme-test
          path: |
            toon_pixazo_ltx_20sec_rhyme.mp4
            pixazo_rhyme_metadata.json
          retention-days: 3
