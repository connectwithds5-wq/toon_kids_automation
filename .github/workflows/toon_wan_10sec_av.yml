name: Toon Story - Wan 2.2 10s Audio Video Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wan-story-av:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_WAN_SPACE: zerogpu-aoti/wan2-2-fp8da-aoti-faster
      HF_WAN_OUTPUT: toon_wan_10sec_story_av.mp4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fonts-noto-devanagari

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth google-auth-oauthlib edge-tts pillow gradio_client

      - name: Check Hugging Face token
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "HF_TOKEN present — authenticated ZeroGPU quota will be used."
          else
            echo "HF_TOKEN not set — public Space anonymous quota will be attempted."
          fi

      - name: Validate script
        run: python -m py_compile src/hf_wan_10sec_story_av.py src/toon_kids_story.py

      - name: Generate 10s story with full audio
        run: python src/hf_wan_10sec_story_av.py

      - name: Verify final video
        run: |
          test -s toon_wan_10sec_story_av.mp4
          ffprobe -v error -show_entries format=duration,size -show_streams -of default=noprint_wrappers=1 toon_wan_10sec_story_av.mp4

      - name: Upload final video artifact
        uses: actions/upload-artifact@v4
        with:
          name: toon-wan-10sec-audio-video
          path: toon_wan_10sec_story_av.mp4
          retention-days: 3
