name: Toon Story - HF Wan 2.2 Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wan-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_WAN_SPACE: alexcheng0072/wan27-free-video-generator
      HF_WAN_OUTPUT: toon_wan_test.mp4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth google-auth-oauthlib edge-tts pillow gradio_client

      - name: Check Hugging Face token
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "HF_TOKEN present — authenticated ZeroGPU quota will be used."
          else
            echo "HF_TOKEN not set — trying the public Space with anonymous quota."
          fi

      - name: Validate test script
        run: python -m py_compile src/hf_wan_test.py src/toon_kids_story.py

      - name: Generate one Toon scene with Wan 2.2
        run: python src/hf_wan_test.py

      - name: Verify output
        run: |
          test -s toon_wan_test.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 toon_wan_test.mp4

      - name: Upload test video artifact
        uses: actions/upload-artifact@v4
        with:
          name: toon-wan-2-2-test
          path: toon_wan_test.mp4
          retention-days: 3
